[server]
headless = true
maxUploadSize = 5
enableXsrfProtection = true
enableCORS = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = "none"
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#eeeeee"
backgroundColor = "#090909"
secondaryBackgroundColor = "#171717"
textColor = "#eeeeee"
font = "sans serif"
